# Rexus only — connects to any Postgres you already have (Supabase, Neon,
# RDS, a local install…). Set DATABASE_URL in .env, then:
#
#   docker compose -f docker-compose.external-db.yml up -d

services:
  rexus:
    build: .
    image: rexus:local
    restart: unless-stopped
    env_file: .env
    environment:
      # REXUS_BACKUP_DIR in .env is a folder on YOUR computer; it is mounted at /backups.
      REXUS_BACKUP_DIR: ${REXUS_BACKUP_DIR:+/backups}
    volumes:
      - ${REXUS_BACKUP_DIR:-rexus-no-backups}:/backups
    ports:
      - "${REXUS_PORT:-8080}:${REXUS_PORT:-8080}"

volumes:
  rexus-no-backups:
